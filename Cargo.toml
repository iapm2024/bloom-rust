[package]
name = "bloom-rust"
version = "0.2.0"
edition = "2021"
authors = ["iapizarro"]
description = "Nord-themed Terminal Cherry Blossom Screensaver written in Rust."

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
rand = "0.8"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
